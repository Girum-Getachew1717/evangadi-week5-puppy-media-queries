<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="./CSS/style.css" />
    <title>Puppy Lovers Page</title>
  </head>
  <body>
    <!-- header -->
    <header class="myheader">
      <h1>Puppy lovers page</h1>
    </header>
    
    
    <main>
      <!-- banner section -->
      <section>
        <div class="banner">
          <img src="images/banner-puppies.jpg" alt="Banner-image" />
        </div>
      </section>

      <!-- three puppies -->
      <section class="three-pupies">
        <div class="image1">
          <img src="./images/puppy-1.jpg" alt="image1" />
        </div>
        <div class="puppy-missing">Puppy missing here!!</div>
        <div class="image2">
          <img src="./images/puppy-2.jpg" alt="image2" />
        </div>
      </section>
      
      <!-- more puppies -->
      <div class="more-puppies">
        <h2 class="more-pappies"><b>More Puppies</b></h2>
      </div>
      <!-- two puppies -->
      <section class="two-puppies">
        <div class="image3">
          <img src="./images/puppy-3.jpg" alt="image3" />
        </div>
        <div class="image4">
          <img src="./images/puppy-4.jpg" alt="image4" />
        </div>
      </section>
    </main>

    <footer>
      <!-- footer section -->
      <section class="footer">
        <h2>Developed by: Girum</h2>
      </section>
    </footer>
  </body>
</html>
